name: docker-publish

# Build the production image and push it to GHCR — same model as the
# bze-frontend-apps monorepo:
#   push to main-v2 (default) -> mainnet flavor, tag <sha8>          (app.cointrunk.io)
#   push to develop           -> testnet flavor, tag testnet-<sha8>  (testnet.cointrunk.io)
# The flavor selects .env.<flavor>.dist, inlined at build time (all public).
on:
  push:
    branches: [main-v2, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write   # comment the release command on the merged PR

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag and flavor
        id: vars
        # --short=8 pinned: the tag is always derivable from any commit
        # listing. develop builds get a testnet- prefix so the two flavors can
        # never be confused inside one GHCR package.
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "flavor=testnet" >> "$GITHUB_OUTPUT"
            echo "tag=testnet-$sha" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=mainnet" >> "$GITHUB_OUTPUT"
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          build-args: |
            FLAVOR=${{ steps.vars.outputs.flavor }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      # Runs after the push succeeded, so the comment doubles as the
      # "image is ready" signal. Direct pushes with no PR are skipped.
      - name: Comment release command on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          BEFORE: ${{ github.event.before }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            body="📦 Image published: \`ghcr.io/${{ github.repository }}:${TAG}\`

          The matching stack auto-releases from this branch; manual deploy on the server:
          \`\`\`bash
          ./release.sh ${TAG#testnet-}
          \`\`\`"
            prev=$(echo "$BEFORE" | cut -c1-8)
            if [ -n "$prev" ] && [ "$prev" != "00000000" ]; then
              body="$body

          Rollback (previous build):
          \`\`\`bash
          ./release.sh ${prev}
          \`\`\`"
            fi
            gh pr comment "$pr" -R "${{ github.repository }}" --body "$body"
          else
            echo "no PR associated with ${{ github.sha }}, skipping comment"
          fi
