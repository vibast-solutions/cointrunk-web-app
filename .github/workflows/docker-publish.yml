name: docker-publish

# Build BOTH flavors of the production image on every push to main-v2 (the
# release branch) and push them to GHCR:
#   mainnet -> tag <sha8>          (app.cointrunk.io)
#   testnet -> tag testnet-<sha8>  (testnet.cointrunk.io)
# One branch drives both deployments — the flavors differ only in the
# .env.<flavor>.dist values inlined at build time (all public).
on:
  push:
    branches: [main-v2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write   # comment the release command on the merged PR

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [mainnet, testnet]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        # --short=8 pinned: the tag is always derivable from any commit
        # listing. testnet builds get a prefix so the two flavors can never be
        # confused inside one GHCR package.
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          if [ "${{ matrix.flavor }}" = "testnet" ]; then
            echo "tag=testnet-$sha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          build-args: |
            FLAVOR=${{ matrix.flavor }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      # mainnet only, so a merged PR gets ONE comment, not two. Runs after the
      # push succeeded, so the comment doubles as the "image is ready" signal.
      - name: Comment release command on the merged PR
        if: matrix.flavor == 'mainnet'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          BEFORE: ${{ github.event.before }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            body="📦 Images published: \`ghcr.io/${{ github.repository }}:${TAG}\` (mainnet) and \`:testnet-${TAG}\` (testnet)

          Both stacks auto-release from this branch; manual deploy on the server:
          \`\`\`bash
          ./release.sh ${TAG}
          \`\`\`"
            prev=$(echo "$BEFORE" | cut -c1-8)
            if [ -n "$prev" ] && [ "$prev" != "00000000" ]; then
              body="$body

          Rollback (previous build):
          \`\`\`bash
          ./release.sh ${prev}
          \`\`\`"
            fi
            gh pr comment "$pr" -R "${{ github.repository }}" --body "$body"
          else
            echo "no PR associated with ${{ github.sha }}, skipping comment"
          fi
